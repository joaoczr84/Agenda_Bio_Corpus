<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sistema de Treinos</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F4F5F7;
    --panel: #FFFFFF;
    --ink: #14171C;
    --ink-soft: #5B6270;
    --ink-mute: #8A8F99;
    --line: #E3E5EA;
    --accent: #E8462F;
    --accent-ink: #FFFFFF;
    --ok-bg: #E6F5EC; --ok-ink: #1F7A45;
    --warn-bg: #FDEAE6; --warn-ink: #B23A1F;
    --sidebar: #14171C;
    --sidebar-ink: #C9CDD4;
    --sidebar-ink-active: #FFFFFF;
    --pI: #2F6FAE; --pR: #3E8A5B; --pM: #B9862B; --pD: #7A57A8; --pL: #B84A7A; --pT: #2C9591;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  .app{display:flex;min-height:100vh;}
  .sidebar{width:210px;flex-shrink:0;background:var(--sidebar);color:var(--sidebar-ink);padding:20px 12px;}
  .brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;color:#fff;padding:6px 10px 20px;letter-spacing:-0.02em;}
  .brand span{color:var(--accent);}
  .brand-logo{display:flex;align-items:center;gap:10px;padding:8px 10px 22px;}
  .brand-logo img{width:34px;height:34px;border-radius:50%;flex-shrink:0;}
  .brand-logo span{color:#fff;font-size:15px;}
  .navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:var(--sidebar-ink);font-size:14px;font-weight:500;padding:10px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px;font-family:inherit;text-decoration:none;box-sizing:border-box;}
  .navbtn:hover{background:rgba(255,255,255,0.06);}
  .navbtn.active{background:var(--accent);color:#fff;}
  .devcredit{margin-top:10px;padding:8px 10px 4px;font-size:11px;color:#5B6270;text-align:center;border-top:1px solid rgba(255,255,255,0.08);}
  .main{flex:1;padding:28px 36px;max-width:1180px;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin:0 0 4px;letter-spacing:-0.01em;}
  .subtitle{color:var(--ink-soft);font-size:13.5px;margin:0 0 22px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px;font-weight:500;}
  input,select{font-family:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent);}
  button.primary{background:var(--accent);color:#fff;border:none;font-family:inherit;font-weight:600;font-size:13.5px;padding:9px 16px;border-radius:8px;cursor:pointer;}
  button.primary:hover{background:#D13A24;}
  button.ghost{background:none;border:1px solid var(--line);color:var(--ink-soft);font-family:inherit;font-size:12.5px;padding:6px 10px;border-radius:7px;cursor:pointer;}
  button.ghost:hover{border-color:var(--ink-mute);color:var(--ink);}
  button.icon{background:none;border:none;cursor:pointer;color:var(--ink-mute);font-size:15px;padding:4px;}
  button.icon:hover{color:var(--warn-ink);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--ink-soft);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:0.03em;padding:8px 10px;border-bottom:1px solid var(--line);}
  td{padding:9px 10px;border-bottom:1px solid #EEEFF2;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;color:#fff;}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .badge.ok{background:var(--ok-bg);color:var(--ok-ink);}
  .badge.warn{background:var(--warn-bg);color:var(--warn-ink);}
  .hourblock{margin-bottom:14px;}
  .hourhead{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:var(--ink);margin-bottom:6px;display:flex;align-items:center;gap:8px;}
  .empty{color:var(--ink-mute);font-size:13px;font-style:italic;padding:14px 0;text-align:center;}
  .alertbar{display:flex;align-items:center;gap:8px;background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:14px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .capbar-track{width:70px;height:6px;background:#EEEFF2;border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:8px;}
  .capbar-fill{height:100%;border-radius:3px;}
  .small{font-size:12px;color:var(--ink-soft);}
  .tag-input{width:64px;}
  .sectiontitle{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-soft);margin:0 0 12px;}
  .monthgrid-wrap{overflow-x:auto;}
  .monthgrid{border-collapse:collapse;font-size:11.5px;}
  .monthgrid th,.monthgrid td{padding:5px 6px;text-align:center;border:1px solid #EEEFF2;}
  .monthgrid th.name,.monthgrid td.name{text-align:left;position:sticky;left:0;background:#fff;min-width:120px;}
  .letterA{background:#DDEBF7;color:#0C447C;font-weight:700;}
  .cellPresente{background:#DCFCE7;color:#166534;font-weight:700;}
  .cellFalta{background:#FEE2E2;color:#991B1B;font-weight:700;}
  .limite-fechado{background:#FEE2E2;}
  .limite-pendente{background:#F0F1F3;}
  .letterB{background:#E2EFDA;color:#27500A;font-weight:700;}
  .letterC{background:#FCE4D6;color:#712B13;font-weight:700;}
  .savehint{position:fixed;bottom:16px;right:20px;background:var(--ink);color:#fff;font-size:12px;padding:8px 14px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;}
  .savehint.show{opacity:0.9;}
  .fichawrap{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .fichacell{border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .fichacell h4{margin:0 0 6px;font-size:12.5px;color:var(--ink-soft);font-weight:700;text-transform:uppercase;}
  .fichacell p{margin:0 0 8px;font-size:13px;line-height:1.4;}
  .loading{padding:60px;text-align:center;color:var(--ink-mute);}
  .helpcard h3{margin:0 0 8px;font-family:'Space Grotesk',sans-serif;font-size:15px;}
  .helpcard p{margin:0 0 8px;font-size:13.5px;line-height:1.55;color:var(--ink-soft);}
  .helpcard p:last-child{margin-bottom:0;}
  .presbtn{background:#F4F5F7;border:1px solid var(--line);border-radius:6px;padding:3px 7px;cursor:pointer;font-size:13px;margin-right:4px;opacity:0.45;}
  .presbtn:hover{opacity:0.8;}
  .presbtn.pres-on{background:var(--ok-bg);border-color:var(--ok-ink);opacity:1;}
  .presbtn.falta-on{background:var(--warn-bg);border-color:var(--warn-ink);opacity:1;}

  .hero{display:flex;align-items:center;gap:18px;background:linear-gradient(135deg, var(--sidebar) 0%, #2A2118 100%);border-radius:16px;padding:24px 28px;margin-bottom:20px;}
  .hero img{width:64px;height:64px;border-radius:50%;flex-shrink:0;}
  .hero-brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;color:#fff;letter-spacing:-0.01em;}
  .hero-greeting{color:#C9CDD4;font-size:13.5px;margin-top:4px;text-transform:capitalize;}

  .statrow{display:grid;grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));gap:12px;}
  .statcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;text-align:center;}
  .statcard.statwarn{border-color:var(--warn-ink);background:var(--warn-bg);}
  .statnum{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;color:var(--ink);}
  .statwarn .statnum{color:var(--warn-ink);}
  .statlabel{font-size:11.5px;color:var(--ink-soft);margin-top:4px;text-transform:uppercase;letter-spacing:0.02em;}

  .navgrid{display:grid;grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));gap:12px;}
  .navcard{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;cursor:pointer;transition:border-color .15s, transform .15s;}
  .navcard:hover{border-color:var(--accent);transform:translateY(-1px);}
  .navcard-icon{font-size:24px;flex-shrink:0;}
  .navcard-title{font-weight:700;font-size:14px;color:var(--ink);}
  .navcard-desc{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .checklabel{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);font-weight:500;cursor:pointer;}
  .checklabel input{margin:0;cursor:pointer;}

  .print-title{display:none;}
  .print-header{display:none;}

  @media print {
    body{background:#fff; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
    .sidebar, .savehint, .no-print, .row button, h1 + .subtitle{display:none !important;}
    .main{padding:0;max-width:none;}
    .print-header{display:flex;align-items:center;gap:14px;margin:0 0 18px;}
    .print-header img{width:48px;height:48px;border-radius:50%;}
    .print-brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.04em;}
    .print-title{display:block;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;margin-top:2px;}
    .monthgrid-wrap{border:none;padding:0;}
    .card{border:none;box-shadow:none;padding:0;}
    .monthgrid th, .monthgrid td{border:1px solid #999; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
    .monthgrid th.name, .monthgrid td.name{position:static;}
    .letterA, .letterB, .letterC, .cellPresente, .cellFalta{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
    h1{display:none;}
  }
  .setupbanner{max-width:620px;margin:60px auto;background:#fff;border:1px solid var(--warn-ink);border-radius:14px;padding:24px 28px;}
  .setupbanner h2{font-family:'Space Grotesk',sans-serif;font-size:18px;margin:0 0 10px;}
  .setupbanner p{font-size:13.5px;line-height:1.6;color:var(--ink-soft);}
  .setupbanner code{background:#F1EFE8;padding:2px 6px;border-radius:5px;font-size:12.5px;}
</style>
</head>

let remoteListenerAttached = false;

function fillMissingDefaults(s){
  const d = defaultState();
  s.personals = s.personals || d.personals;
  s.estacoes = s.estacoes || d.estacoes;
  s.fichas = s.fichas || d.fichas;
  s.agenda = s.agenda || [];
  s.alunos = s.alunos || [];
  s.limitesHorario = s.limitesHorario || d.limitesHorario;
  return s;
}

async function loadState(){
  if(!FIREBASE_CONFIGURED){ renderSetupBanner(); return; }
  try{
    const snap = await db.ref('gym_state').once('value');
    if(snap.exists()){
      state = fillMissingDefaults(snap.val());
    } else {
      state = defaultState();
      await saveState(false);
    }
  }catch(e){
    console.error('erro ao carregar', e);
    state = defaultState();
  }
  render();
  attachRemoteListener();
}

function attachRemoteListener(){
  if(remoteListenerAttached || !db) return;
  remoteListenerAttached = true;
  db.ref('gym_state').on('value', snap=>{
    if(snap.exists()){
      state = fillMissingDefaults(snap.val());
      render();
    }
  });
}

let saveTimeout=null;
async function saveState(showHint){
  if(!db) return;
  try{
    await db.ref('gym_state').set(state);
    if(showHint!==false){
      const el = document.getElementById('savehint');
      el.classList.add('show');
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(()=>el.classList.remove('show'), 1200);
    }
  }catch(e){ console.error('erro ao salvar', e); }
}

function uid(){ return 'e'+Math.random().toString(36).slice(2,10); }

function personalByCode(code){ return state.personals.find(p=>p.code===code); }

function fichaForBlocoTreino(treino, bloco){
  return state.fichas.find(f=>f.treino===treino && Number(f.bloco)===Number(bloco));
}

function exerciciosDoBloco(treino, bloco){
  const f = fichaForBlocoTreino(treino, bloco);
  if(!f) return [];
  return [f.exercicio1, f.exercicio2, f.exercicio3].filter(Boolean);
}

function exerciciosDaEntry(e){
  if(e.blocos && e.blocos.length){
    const set = new Set();
    e.blocos.forEach(b=> exerciciosDoBloco(b.treino, b.bloco).forEach(ex=>set.add(ex)));
    return [...set];
  }
  if(e.bloco){ return exerciciosDoBloco(e.treino, e.bloco); }
  if(e.estacao){ return [e.estacao]; } // compatibilidade com lançamentos antigos
  return [];
}

function blocosParaTreino(treino){
  return state.fichas.filter(f=>f.treino===treino).map(f=>f.bloco).sort((a,b)=>a-b);
}

function blocoOptionsFor(selBloco, treino){
  const blocos = blocosParaTreino(treino);
  return `<option value="">—</option>` + blocos.map(b=>`<option value="${b}" ${Number(selBloco)===b?'selected':''}>Bloco ${b}</option>`).join('');
}

const SUPERSCRIPTS = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function toSuperscript(n){
  return String(n).split('').map(d=>SUPERSCRIPTS[d]||d).join('');
}

function displayLabelForEntry(e){
  if(e.blocos && e.blocos.length){
    return e.blocos.map(b=>`${b.treino}${toSuperscript(b.bloco)}`).join('+');
  }
  return e.treino + (e.bloco ? toSuperscript(e.bloco) : '');
}

function blocoDisplayFor(e){
  if(e.blocos && e.blocos.length){
    const labels = e.blocos.map(b=>`${b.treino}${toSuperscript(b.bloco)}`).join('+');
    const ex = exerciciosDaEntry(e);
    return `Full (${labels})` + (ex.length ? ` — ${ex.join(', ')}` : '');
  }
  if(e.bloco){
    const ex = exerciciosDaEntry(e);
    return `Bloco ${e.bloco}` + (ex.length ? ` — ${ex.join(', ')}` : '');
  }
  if(e.estacao){ return e.estacao; } // legado
  return '—';
}

function alunoByNome(nome){ return state.alunos.find(a=>a.nome.trim().toLowerCase()===String(nome).trim().toLowerCase()); }

function planoLabel(aluno){
  if(!aluno) return '';
  if(aluno.planoTipo==='custom') return `Personalizado (${aluno.diasContratados}x/semana)`;
  const p = PLANOS[aluno.planoTipo];
  return p ? p.label : '';
}

function entriesBeforeForAluno(nomeAluno, beforeDateISO, beforeHora){
  const key = (d,h)=> d + String(h).padStart(2,'0');
  const limitKey = key(beforeDateISO, beforeHora==null?99:beforeHora);
  return state.agenda
    .filter(e=> e.nome.trim().toLowerCase()===String(nomeAluno).trim().toLowerCase() && key(e.data,e.hora) < limitKey)
    .sort((a,b)=> key(a.data,a.hora).localeCompare(key(b.data,b.hora)));
}

function nextTreinoForAluno(nomeAluno, beforeDateISO, beforeHora){
  const entries = entriesBeforeForAluno(nomeAluno, beforeDateISO, beforeHora);
  if(entries.length===0) return 'A';
  const last = entries[entries.length-1];
  const order = ['A','B','C'];
  const idx = order.indexOf(last.treino);
  return order[(idx+1)%3];
}

function lastPersonalForAluno(nomeAluno, beforeDateISO, beforeHora){
  const entries = entriesBeforeForAluno(nomeAluno, beforeDateISO, beforeHora);
  for(let i=entries.length-1; i>=0; i--){
    if(entries[i].personal) return entries[i].personal;
  }
  return null;
}

function isoWeekRange(dateISO){
  const [y,m,d] = dateISO.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const dow = dt.getDay(); // 0=Dom
  const diffToMonday = (dow===0? -6 : 1-dow);
  const monday = new Date(dt); monday.setDate(dt.getDate()+diffToMonday);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  const toISO = (x)=> x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
  return [toISO(monday), toISO(sunday)];
}

function confirmedThisWeek(nomeAluno, refDateISO){
  const [start,end] = isoWeekRange(refDateISO || todayISO());
  return state.agenda.filter(e=>
    e.nome.trim().toLowerCase()===String(nomeAluno).trim().toLowerCase() &&
    e.data>=start && e.data<=end && e.confirmado===true
  ).length;
}

function weeklyUsage(nomeAluno, refDateISO){
  const [start,end] = isoWeekRange(refDateISO || todayISO());
  return state.agenda.filter(e=>
    e.nome.trim().toLowerCase()===String(nomeAluno).trim().toLowerCase() &&
    e.data>=start && e.data<=end && e.confirmado!==false
  ).length;
}

function autoFillAgendaForDate(dateISO){
  const [y,m,d] = dateISO.split('-').map(Number);
  const dow = new Date(y, m-1, d).getDay();
  let added = 0;
  state.alunos.forEach(aluno=>{
    (aluno.horariosFixos||[]).filter(h=>h.dia===dow).forEach(h=>{
      const jaExiste = state.agenda.some(e=> e.data===dateISO && e.hora===h.hora && e.nome.trim().toLowerCase()===aluno.nome.trim().toLowerCase());
      if(!jaExiste){
        const treino = nextTreinoForAluno(aluno.nome, dateISO, h.hora);
        state.agenda.push({id:uid(), data:dateISO, hora:h.hora, treino, nome:aluno.nome, personal:'', bloco:null, confirmado:null, origemAuto:true});
        added++;
      }
    });
  });
  saveState();
  return added;
}

// Simula o preenchimento automático "inteligente": para cada aluno com horário fixo
// no dia, mantém o treino sugerido pela rotação (A→B→C) e tenta escolher bloco +
// Personal que não estourem nenhuma capacidade (Personal, estação/aparelho, limite
// geral do horário) — dando preferência ao mesmo Personal do lançamento anterior do
// aluno. Não grava nada em state.agenda; devolve uma lista de propostas para revisão.
function simulateSmartAutoFill(dateISO){
  const [y,m,d] = dateISO.split('-').map(Number);
  const dow = new Date(y, m-1, d).getDay();

  // contadores "em execução" por horário, começando do que já está lançado no dia
  const running = {}; // hora -> {perPersonal:{}, perEstacao:{}, totalGeral:0}
  const getBucket = (hora)=>{
    if(!running[hora]){
      const {perPersonal, perEstacao, totalGeral} = computeConflicts(dateISO, hora);
      running[hora] = {
        perPersonal: {...perPersonal},
        perEstacao: {...perEstacao},
        totalGeral: totalGeral
      };
    }
    return running[hora];
  };

  const propostas = [];

  state.alunos.forEach(aluno=>{
    (aluno.horariosFixos||[]).filter(h=>h.dia===dow).forEach(h=>{
      const hora = h.hora;
      const jaExiste = state.agenda.some(e=> e.data===dateISO && e.hora===hora && e.nome.trim().toLowerCase()===aluno.nome.trim().toLowerCase());
      if(jaExiste) return;

      const bucket = getBucket(hora);
      const treino = nextTreinoForAluno(aluno.nome, dateISO, hora);
      const reasons = [];

      // --- escolher Personal: preferir o mesmo do lançamento anterior, se tiver vaga ---
      const preferido = lastPersonalForAluno(aluno.nome, dateISO, hora);
      let personal = '';
      const personalCabe = (code)=>{
        const p = personalByCode(code);
        if(!p) return false;
        return (bucket.perPersonal[code]||0) < p.cap;
      };
      if(preferido && personalCabe(preferido)){
        personal = preferido;
      } else {
        // fallback: personal com mais vaga sobrando no horário
        let melhor = null, melhorFolga = -Infinity;
        state.personals.forEach(p=>{
          const folga = p.cap - (bucket.perPersonal[p.code]||0);
          if(folga > melhorFolga){ melhorFolga = folga; melhor = p; }
        });
        if(melhor){
          personal = melhor.code;
          if(melhorFolga <= 0) reasons.push('personal'); // ninguém tinha vaga sobrando
        }
        if(preferido) reasons.push('personal-trocado'); // preferido existia mas não coube
      }
      if(personal && !personalCabe(personal) && !reasons.includes('personal')) reasons.push('personal');

      // --- escolher Bloco: primeiro que não estoura nenhuma estação envolvida ---
      const blocosDisponiveis = blocosParaTreino(treino);
      let bloco = null, blocoConflita = false;
      if(blocosDisponiveis.length){
        let semConflito = null;
        let menosPiorBloco = blocosDisponiveis[0], menosPiorExcesso = Infinity;
        blocosDisponiveis.forEach(b=>{
          const ex = exerciciosDoBloco(treino, b);
          let excesso = 0, temConflito = false;
          ex.forEach(nome=>{
            const est = estacaoByName(nome);
            if(est){
              const usado = bucket.perEstacao[nome]||0;
              if(usado + 1 > est.cap){ temConflito = true; excesso += (usado + 1 - est.cap); }
            }
          });
          if(!temConflito && semConflito===null) semConflito = b;
          if(excesso < menosPiorExcesso){ menosPiorExcesso = excesso; menosPiorBloco = b; }
        });
        if(semConflito!==null){ bloco = semConflito; }
        else { bloco = menosPiorBloco; blocoConflita = true; reasons.push('estacao'); }
      }

      // --- checar limite geral do horário com essa adição ---
      const limite = limiteHorario(dow, hora);
      if(limite!==null && (limite===0 || (bucket.totalGeral+1) > limite)){
        reasons.push('geral');
      }

      // atualiza os contadores "em execução" para as próximas propostas do mesmo horário
      if(personal){ bucket.perPersonal[personal] = (bucket.perPersonal[personal]||0)+1; }
      if(bloco!=null){
        exerciciosDoBloco(treino, bloco).forEach(nome=>{
          bucket.perEstacao[nome] = (bucket.perEstacao[nome]||0)+1;
        });
      }
      bucket.totalGeral += 1;

      propostas.push({
        nome: aluno.nome, data: dateISO, hora, treino, bloco, personal,
        conflict: reasons.length>0, reasons
      });
    });
  });

  return propostas.sort((a,b)=> a.hora-b.hora || a.nome.localeCompare(b.nome));
}

function runSmartAutoFill(){
  const propostas = simulateSmartAutoFill(selectedDate);
  autoFillPreview = propostas;
  agendaNotice = propostas.length===0 ? 'Nenhum aluno novo para preencher (já lançados ou sem horário fixo nesse dia).' : '';
  renderMain();
}

function applyAutoFillPreview(){
  if(!autoFillPreview) return;
  autoFillPreview.forEach(p=>{
    state.agenda.push({
      id: uid(), data: p.data, hora: p.hora, treino: p.treino, nome: p.nome,
      personal: p.personal || '', bloco: p.bloco, confirmado: null, origemAuto: true
    });
  });
  const total = autoFillPreview.length;
  const comConflito = autoFillPreview.filter(p=>p.conflict).length;
  autoFillPreview = null;
  saveState();
  agendaNotice = `${total} aluno(s) preenchido(s) automaticamente` + (comConflito>0 ? ` (${comConflito} com conflito para revisar).` : '.');
  renderMain();
}

function estacaoByName(nome){ return state.estacoes.find(e=>e.nome===nome); }

function diaSemanaFromData(dataISO){
  const [y,m,d] = dataISO.split('-').map(Number);
  return new Date(y, m-1, d).getDay(); // 0=Dom ... 6=Sáb
}

function limiteHorario(dia, hora){
  const key = `${dia}-${hora}`;
  const v = state.limitesHorario[key];
  return (v===undefined) ? null : v; // null = sem configuração (sábado pendente, etc.)
}

function computeConflicts(dateISO, hora){
  const entries = state.agenda.filter(e=>e.data===dateISO && e.hora===hora);
  const perPersonal = {};
  const perEstacao = {};
  entries.forEach(e=>{
    if(e.personal){ perPersonal[e.personal] = (perPersonal[e.personal]||0)+1; }
    exerciciosDaEntry(e).forEach(nome=>{
      perEstacao[nome] = (perEstacao[nome]||0)+1;
    });
  });
  const totalGeral = entries.length;
  return {perPersonal, perEstacao, totalGeral};
}

function entryHasConflict(e){
  const {perPersonal, perEstacao, totalGeral} = computeConflicts(e.data, e.hora);
  let conflict = false, reasons=[];
  if(e.personal){
    const p = personalByCode(e.personal);
    if(p && perPersonal[e.personal] > p.cap){ conflict=true; reasons.push('personal'); }
  }
  exerciciosDaEntry(e).forEach(nome=>{
    const est = estacaoByName(nome);
    if(est && perEstacao[nome] > est.cap){ conflict=true; if(!reasons.includes('estacao')) reasons.push('estacao'); }
  });
  const dia = diaSemanaFromData(e.data);
  const limite = limiteHorario(dia, e.hora);
  if(limite!==null){
    if(limite===0 || totalGeral>limite){ conflict=true; reasons.push('geral'); }
  }
  return {conflict, reasons};
}

function allConflictsForDate(dateISO){
  const alerts = [];
  const dia = diaSemanaFromData(dateISO);
  const hoursUsed = [...new Set(state.agenda.filter(e=>e.data===dateISO).map(e=>e.hora))];
  hoursUsed.forEach(h=>{
    const {perPersonal, perEstacao, totalGeral} = computeConflicts(dateISO, h);
    Object.keys(perPersonal).forEach(code=>{
      const p = personalByCode(code);
      if(p && perPersonal[code] > p.cap){
        alerts.push(`${p.nome} tem ${perPersonal[code]} alunos às ${h}h (limite ${p.cap})`);
      }
    });
    Object.keys(perEstacao).forEach(nome=>{
      const est = estacaoByName(nome);
      if(est && perEstacao[nome] > est.cap){
        alerts.push(`"${nome}" tem ${perEstacao[nome]} alunos às ${h}h (capacidade ${est.cap})`);
      }
    });
    const limite = limiteHorario(dia, h);
    if(limite!==null){
      if(limite===0 && totalGeral>0){
        alerts.push(`Horário fechado às ${h}h (${totalGeral} aluno(s) lançado(s) mesmo assim)`);
      } else if(totalGeral>limite){
        alerts.push(`Lotação geral às ${h}h: ${totalGeral} aluno(s) (limite ${limite})`);
      }
    }
  });
  return alerts;
}

        <div class="navcard-title">${title}</div>
        <div class="navcard-desc">${desc}</div>
      </div>
    </div>`;

  return `
    <div class="hero">
      <img src="${LOGO_SRC}" alt="Bio Corpus" />
      <div>
        <div class="hero-brand">Bio Corpus Academia</div>
        <div class="hero-greeting">${saudacao}! Hoje é ${dataFormatada}.</div>
      </div>
    </div>

    ${conflitosHoje.length ? `<div class="alertbar">${icon('alert-triangle')} ${conflitosHoje.length} conflito${conflitosHoje.length>1?'s':''} hoje: ${conflitosHoje.join(' · ')}</div>` : ''}

    <div class="statrow">
      ${stat(entriesHoje.length, 'alunos agendados hoje')}
      ${stat(confirmadosHoje, 'presenças confirmadas hoje')}
      ${stat(conflitosHoje.length, 'conflitos hoje', conflitosHoje.length>0)}
      ${stat(totalAlunos, 'alunos cadastrados')}
      ${stat(totalPersonals, 'personals ativos')}
    </div>

    <div class="sectiontitle" style="margin-top:22px;">Acesso rápido</div>
    <div class="navgrid">
      ${navCard('agenda','calendar-event','Agenda diária','Lançar e conferir os treinos de hoje')}
      ${navCard('mensal','table','Controle mensal','Ver o histórico do mês por aluno')}
      ${navCard('alunos','users','Alunos','Cadastro, planos e horários fixos')}
      ${navCard('fichas','clipboard-list','Fichas de treino','Blocos de exercícios A/B/C')}
      ${navCard('personals','users','Personals','Capacidade de cada Personal')}
      ${navCard('estacoes','building-warehouse','Estações','Aparelhos e capacidade física')}
    </div>
  `;
}

function renderAgenda(){
  const alerts = allConflictsForDate(selectedDate);
  const entriesForDate = state.agenda.filter(e=>e.data===selectedDate);
  const personalOptionsFor = (sel)=> `<option value="">—</option>` + state.personals.map(p=>`<option value="${p.code}" ${sel===p.code?'selected':''}>${p.nome} (${p.code})</option>`).join('');
  const treinoOptionsFor = (sel)=> TREINOS.map(t=>`<option value="${t}" ${sel===t?'selected':''}>${t}</option>`).join('');
  const hourOptionsFor = (sel)=> HOURS.map(h=>`<option value="${h}" ${sel===h?'selected':''}>${h}h</option>`).join('');

  let hourBlocks = '';
  HOURS.forEach(h=>{
    const rows = entriesForDate.filter(e=>e.hora===h).sort((a,b)=> a.nome.localeCompare(b.nome));
    let rowsHtml = '';
    if(rows.length===0){
      rowsHtml = '';
    } else {
      rowsHtml = rows.map(e=>{
        const {conflict} = entryHasConflict(e);
        const p = personalByCode(e.personal);
        if(editingEntryId === e.id){
          const isFull = (Array.isArray(e.blocos) && e.blocos.length>0) || editingFullBodyActive;
          const treinoCell = isFull
            ? `<strong class="small">Full</strong>`
            : `<select style="width:52px;" onchange="updateEntryField('${e.id}','treino',this.value)">${treinoOptionsFor(e.treino)}</select>`;
          const blocoCell = isFull
            ? `<button class="icon" title="Voltar para bloco único" onclick="toggleEditFullBody('${e.id}')">↩️ Full</button>`
            : `<select onchange="updateEntryField('${e.id}','bloco',this.value)">${blocoOptionsFor(e.bloco, e.treino)}</select> <button class="icon" title="Treino completo" onclick="toggleEditFullBody('${e.id}')">${icon('building-warehouse')}</button>`;
          let rows = `<tr style="background:#F4F5F7;">
            <td>${treinoCell}</td>
            <td><input value="${escapeHtml(e.nome)}" style="width:100%;" onchange="updateEntryField('${e.id}','nome',this.value)"></td>
            <td><select onchange="updateEntryField('${e.id}','personal',this.value)">${personalOptionsFor(e.personal)}</select></td>
            <td>${blocoCell}</td>
            <td class="small">hora: <select onchange="updateEntryField('${e.id}','hora',this.value)">${hourOptionsFor(e.hora)}</select></td>
            <td></td>
            <td style="text-align:right;"><button class="icon" title="Concluir edição" onclick="stopEditEntry()">${icon('check')}</button></td>
          </tr>`;
          if(isFull){
            const chips = (e.blocos||[]).map((b,idx)=>`
              <span class="chip" style="background:#5B6270;">${b.treino}${toSuperscript(b.bloco)}
                <button class="icon" style="color:#fff;padding:0 0 0 4px;font-size:11px;" onclick="removeEditFullBodyBloco('${e.id}',${idx})">✕</button>
              </span>`).join(' ');
            rows += `<tr style="background:#F4F5F7;"><td colspan="7" style="padding:10px 14px;">
              <div class="small" style="margin-bottom:6px;font-weight:600;">Combinação de treino completo:</div>
              <div style="margin-bottom:8px;">${chips || '<span class="small">Nenhum bloco ainda.</span>'}</div>
              <div class="row" style="gap:8px;">
                <select id="editfb_treino_${e.id}" onchange="refreshEditFbBlocoOptions('${e.id}')">${TREINOS.map(t=>`<option value="${t}">${t}</option>`).join('')}</select>
                <select id="editfb_bloco_${e.id}">${blocoOptionsFor('', TREINOS[0])}</select>
                <button class="ghost" onclick="addEditFullBodyBloco('${e.id}')">${icon('plus')} adicionar bloco</button>
              </div>
            </td></tr>`;
          }
          return rows;
        }
        const presencaHtml = `
          <button class="presbtn ${e.confirmado===true?'pres-on':''}" title="Confirmar presença" onclick="setPresenca('${e.id}',true)">✅</button>
          <button class="presbtn ${e.confirmado===false?'falta-on':''}" title="Marcar falta" onclick="setPresenca('${e.id}',false)">❌</button>
        `;
        return `<tr style="${conflict?'background:var(--warn-bg);':''}">
          <td><strong>${e.treino}</strong></td>
          <td>${escapeHtml(e.nome)}</td>
          <td>${p? `<span class="chip" style="background:${PERSONAL_COLORS[e.personal]||'#999'}">${p.nome}</span>` : '<span class="small">—</span>'}</td>
          <td class="small">${escapeHtml(blocoDisplayFor(e))}</td>
          <td>${conflict?'<span class="badge warn">'+icon('alert-triangle')+' conflito</span>':'<span class="badge ok">ok</span>'}</td>
          <td style="white-space:nowrap;">${presencaHtml}</td>
          <td style="text-align:right;white-space:nowrap;">
            <button class="icon" title="Editar" onclick="startEditEntry('${e.id}')">${icon('edit')}</button>
            <button class="icon" title="Remover" onclick="removeEntry('${e.id}')">${icon('trash')}</button>
          </td>
        </tr>`;
      }).join('');
    }
    if(rows.length>0){
      hourBlocks += `<div class="hourblock">
        <div class="hourhead">${h}h <span class="small" style="font-weight:400;">(${rows.length} aluno${rows.length>1?'s':''})</span></div>
        <table><thead><tr><th style="width:36px;">Treino</th><th>Aluno</th><th>Personal</th><th>Bloco</th><th>Status</th><th>Presença</th><th></th></tr></thead>
        <tbody>${rowsHtml}</tbody></table>
      </div>`;
    }
  });
  if(entriesForDate.length===0){
    hourBlocks = `<div class="empty">Nenhum aluno lançado para ${fmtDatePt(selectedDate)}. Use o formulário acima para adicionar, ou clique em "preencher automaticamente".</div>`;
  }

  const personalOptions = state.personals.map(p=>`<option value="${p.code}">${p.nome} (${p.code})</option>`).join('');
  const blocoOptions = blocoOptionsFor('', 'A');
  const hourOptions = HOURS.map(h=>`<option value="${h}">${h}h</option>`).join('');
  const alunosDatalist = state.alunos.map(a=>`<option value="${escapeHtml(a.nome)}">`).join('');
  const fbChips = fullBodyBlocos.map((b,idx)=>`
    <span class="chip" style="background:#5B6270;">${b.treino}${toSuperscript(b.bloco)}
      <button class="icon" style="color:#fff;padding:0 0 0 4px;font-size:11px;" onclick="removeFullBodyBloco(${idx})">✕</button>
    </span>`).join(' ');
  const fbTreinoOptions = TREINOS.map(t=>`<option value="${t}">${t}</option>`).join('');
  const fbBlocoOptions = blocoOptionsFor('', 'A');

  return `
    <h1>Agenda diária</h1>
    <p class="subtitle">Lance quem treina, com qual Personal e em qual bloco. Conflitos aparecem automaticamente.</p>

    <div class="card">
      <div class="row">
        <div><label>Data</label><input type="date" id="f_data" value="${selectedDate}" onchange="changeDate(this.value)"></div>
        <div><label>Hora</label><select id="f_hora">${hourOptions}</select></div>
        <div><label>Treino</label><select id="f_treino" onchange="refreshBlocoOptionsForm()" ${fullBodyMode?'disabled':''}><option value="A">A</option><option value="B">B</option><option value="C">C</option></select></div>
        <div style="flex:1;min-width:160px;"><label>Nome do aluno</label>
          <input id="f_nome" list="alunos_list" placeholder="Nome do aluno" style="width:100%;" onchange="suggestTreinoFor(this.value)">
          <datalist id="alunos_list">${alunosDatalist}</datalist>
        </div>
        <div><label>Personal</label><select id="f_personal"><option value="">—</option>${personalOptions}</select></div>
        <div id="bloco_normal_wrap" style="${fullBodyMode?'display:none;':''}"><label>Bloco</label><select id="f_bloco" onchange="updateBlocoPreview()">${blocoOptions}</select></div>
        <div><button class="primary" onclick="addEntry()">${icon('plus')} adicionar</button></div>
      </div>
      <div id="f_bloco_preview" class="small" style="margin-top:6px;color:var(--ink-soft);"></div>

      <div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px;">
        <label class="checklabel"><input type="checkbox" id="f_fullbody" ${fullBodyMode?'checked':''} onchange="toggleFullBody()"> Treino completo (full body) — combinar blocos de treinos diferentes</label>
        <div id="fullbody_picker" style="display:${fullBodyMode?'block':'none'};margin-top:8px;">
          <div class="row" style="gap:8px;">
            <div><label>Treino</label><select id="fb_treino" onchange="refreshFbBlocoOptions()">${fbTreinoOptions}</select></div>
            <div><label>Bloco</label><select id="fb_bloco">${fbBlocoOptions}</select></div>
            <div><button class="ghost" onclick="addFullBodyBloco()">${icon('plus')} adicionar bloco à combinação</button></div>
          </div>
          <div style="margin-top:8px;">${fbChips || '<span class="small">Nenhum bloco adicionado ainda.</span>'}</div>
        </div>
      </div>

      <div id="f_error" style="color:var(--warn-ink);font-size:12.5px;margin-top:8px;">${agendaNotice}</div>
      <div style="margin-top:10px;">
        <button class="ghost" onclick="runSmartAutoFill()">${icon('calendar-event')} preencher automaticamente (sugestão inteligente)</button>
        <button class="ghost" onclick="runAutoFill()">${icon('calendar-event')} preencher rápido (sem Personal/Bloco)</button>
      </div>
    </div>

    ${autoFillPreviewHtml()}

    ${alerts.length? `<div class="alertbar">${icon('alert-triangle')} ${alerts.length} conflito${alerts.length>1?'s':''} em ${fmtDatePt(selectedDate)}: ${alerts.join(' · ')}</div>` : ''}

    ${hourBlocks}
  `;
}

function reasonLabel(r){
  return {personal:'Personal lotado', 'personal-trocado':'Personal preferido indisponível', estacao:'Aparelho lotado', geral:'Limite geral do horário'}[r] || r;
}

function autoFillPreviewHtml(){
  if(!autoFillPreview || !autoFillPreview.length) return '';
  const comConflito = autoFillPreview.filter(p=>p.conflict).length;
  const rows = autoFillPreview.map(p=>{
    const personalNome = p.personal ? (personalByCode(p.personal)?.nome || p.personal) : '—';
    const blocoTxt = p.bloco!=null ? `Bloco ${p.bloco}` : '—';
    const status = p.conflict
      ? `<span class="badge warn" title="${escapeHtml(p.reasons.map(reasonLabel).join(', '))}">${icon('alert-triangle')} revisar</span>`
      : `<span class="badge ok">ok</span>`;
    return `<tr>
      <td>${escapeHtml(p.nome)}</td>
      <td>${p.hora}h</td>
      <td>${escapeHtml(p.treino)}</td>
      <td>${blocoTxt}</td>
      <td>${escapeHtml(personalNome)}</td>
      <td>${status}</td>
    </tr>`;
  }).join('');
  return `
    <div class="card">
      <div class="sectiontitle">Prévia do preenchimento automático — ${autoFillPreview.length} aluno(s)${comConflito>0 ? `, ${comConflito} com conflito` : ''}</div>
      <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>Aluno</th><th>Hora</th><th>Treino</th><th>Bloco</th><th>Personal</th><th>Status</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="small" style="margin-top:8px;">Itens marcados "revisar" respeitam o treino sugerido pela rotação, mas não coube um Personal/bloco/limite geral totalmente livre — ajuste manualmente depois de aplicar, se preferir.</div>
      <div style="margin-top:12px;">
        <button class="primary" onclick="applyAutoFillPreview()">${icon('check')} aplicar à agenda</button>
        <button class="ghost" onclick="cancelAutoFillPreview()">cancelar</button>
      </div>
    </div>
  `;
}

function changeDate(v){ selectedDate = v; autoFillPreview = null; renderMain(); }

function addEntry(){
  const hora = parseInt(document.getElementById('f_hora').value,10);
  const nome = document.getElementById('f_nome').value.trim();
  const personal = document.getElementById('f_personal').value;
  if(!nome){ agendaNotice = 'Digite o nome do aluno.'; renderMain(); return; }

  let treino, bloco, blocos;
  if(fullBodyBlocos.length){
    if(fullBodyBlocos.length < 2){ agendaNotice = 'Adicione pelo menos 2 blocos na combinação de treino completo.'; renderMain(); return; }
    treino = 'Full';
    bloco = null;
    blocos = [...fullBodyBlocos];
  } else {
    treino = document.getElementById('f_treino').value;
    const blocoRaw = document.getElementById('f_bloco').value;
    bloco = blocoRaw ? parseInt(blocoRaw,10) : null;
    blocos = undefined;
  }

  const entry = {id:uid(), data:selectedDate, hora, treino, nome, personal, bloco, confirmado:null};
  if(blocos) entry.blocos = blocos;
  state.agenda.push(entry);
  saveState();

  fullBodyBlocos = [];
  fullBodyMode = false;

  const aluno = alunoByNome(nome);
  agendaNotice = '';
  if(aluno){
    const meta = planoMeta(aluno);
    const usage = weeklyUsage(nome, selectedDate);
    if(meta!=null && usage >= meta){
      agendaNotice = `${icon('alert-triangle')} ${escapeHtml(nome)} atingiu a cota semanal do plano (${usage}/${meta}). Lançamento feito mesmo assim.`;
    }
  }
  renderMain();
  const nomeInput = document.getElementById('f_nome');
  if(nomeInput) nomeInput.value = '';
}

function suggestTreinoFor(nome){
  const aluno = alunoByNome(nome);
  if(!aluno) return;
  const hora = parseInt(document.getElementById('f_hora').value,10);
  const treino = nextTreinoForAluno(nome, selectedDate, hora);
  const sel = document.getElementById('f_treino');
  if(sel) sel.value = treino;
  refreshBlocoOptionsForm();
}

function refreshBlocoOptionsForm(){
  const treinoSel = document.getElementById('f_treino');
  const blocoSel = document.getElementById('f_bloco');
  if(!treinoSel || !blocoSel) return;
  const treino = treinoSel.value;
  const currentVal = blocoSel.value;
  const blocos = blocosParaTreino(treino);
  blocoSel.innerHTML = '<option value="">—</option>' + blocos.map(b=>`<option value="${b}">Bloco ${b}</option>`).join('');
  if(blocos.some(b=>String(b)===currentVal)) blocoSel.value = currentVal;
  updateBlocoPreview();
}

function updateBlocoPreview(){
  const treinoSel = document.getElementById('f_treino');
  const blocoSel = document.getElementById('f_bloco');
  const preview = document.getElementById('f_bloco_preview');
  if(!treinoSel || !blocoSel || !preview) return;
  const bloco = parseInt(blocoSel.value,10);
  if(!bloco){ preview.textContent = ''; return; }
  const ex = exerciciosDoBloco(treinoSel.value, bloco);
  preview.textContent = ex.length ? `Exercícios: ${ex.join(', ')}` : 'Nenhum exercício cadastrado para este bloco ainda.';
}

function toggleFullBody(){
  fullBodyMode = document.getElementById('f_fullbody').checked;
  if(!fullBodyMode){ fullBodyBlocos = []; }
  renderMain();
}

function refreshFbBlocoOptions(){
  const treinoSel = document.getElementById('fb_treino');
  const blocoSel = document.getElementById('fb_bloco');
  if(!treinoSel || !blocoSel) return;
  const blocos = blocosParaTreino(treinoSel.value);
  blocoSel.innerHTML = blocos.map(b=>`<option value="${b}">Bloco ${b}</option>`).join('');
}

function addFullBodyBloco(){
  const treino = document.getElementById('fb_treino').value;
  const bloco = parseInt(document.getElementById('fb_bloco').value,10);
  if(!bloco) return;
  if(!fullBodyBlocos.some(b=>b.treino===treino && b.bloco===bloco)){
    fullBodyBlocos.push({treino, bloco});
  }
  renderMain();
}

function removeFullBodyBloco(idx){
  fullBodyBlocos.splice(idx,1);
  renderMain();
}

function toggleEditFullBody(id){
  const e = state.agenda.find(x=>x.id===id);
  if(!e) return;
  if(Array.isArray(e.blocos) && e.blocos.length){
    e.blocos = undefined;
    e.bloco = null;
    e.treino = TREINOS.includes(e.treino) ? e.treino : 'A';
    saveState();
  } else {
    editingFullBodyActive = !editingFullBodyActive;
  }
  renderMain();
  renderMain();
}

function refreshEditFbBlocoOptions(id){
  const treinoSel = document.getElementById(`editfb_treino_${id}`);
  const blocoSel = document.getElementById(`editfb_bloco_${id}`);
  if(!treinoSel || !blocoSel) return;
  const blocos = blocosParaTreino(treinoSel.value);
  blocoSel.innerHTML = blocos.map(b=>`<option value="${b}">Bloco ${b}</option>`).join('');
}

function addEditFullBodyBloco(id){
  const treinoSel = document.getElementById(`editfb_treino_${id}`);
  const blocoSel = document.getElementById(`editfb_bloco_${id}`);
  if(!treinoSel || !blocoSel) return;
  const treino = treinoSel.value;
  const bloco = parseInt(blocoSel.value,10);
  if(!bloco) return;
  const e = state.agenda.find(x=>x.id===id);
  if(!e) return;
  const atual = Array.isArray(e.blocos) ? e.blocos : [];
  if(!atual.some(b=>b.treino===treino && b.bloco===bloco)){
    atual.push({treino, bloco});
  }
  e.blocos = atual;
  e.treino = 'Full';
  e.bloco = null;
  editingFullBodyActive = false; // já está persistido de verdade, não precisa mais do estado local
  saveState();
  renderMain();
}

function removeEditFullBodyBloco(id, idx){
  const e = state.agenda.find(x=>x.id===id);
  if(!e || !Array.isArray(e.blocos)) return;
  e.blocos.splice(idx,1);
  if(e.blocos.length===0){
    // não deixa um array vazio ir pro Firebase (ele apaga o campo sozinho) — volta pro modo local "escolhendo"
    e.blocos = undefined;
    e.bloco = null;
    editingFullBodyActive = true;
  }
  saveState();
  renderMain();
}

function runAutoFill(){
  const added = autoFillAgendaForDate(selectedDate);
  agendaNotice = added>0 ? `${added} aluno(s) preenchido(s) automaticamente.` : 'Nenhum aluno novo para preencher (já lançados ou sem horário fixo nesse dia).';
  renderMain();
}

function removeEntry(id){
  state.agenda = state.agenda.filter(e=>e.id!==id);
  saveState();
  renderMain();
}

function startEditEntry(id){
  editingEntryId = id;
  editingFullBodyActive = false;
  renderMain();
}

function stopEditEntry(){
  editingEntryId = null;
  editingFullBodyActive = false;
  renderMain();
}

function updateEntryField(id, field, value){
  const e = state.agenda.find(x=>x.id===id);
  if(!e) return;
  if(field==='hora' || field==='bloco'){ value = value===''? null : parseInt(value,10); }
  e[field] = value;
  saveState();
  renderMain();
}

// ---------- CONTROLE MENSAL ----------
function renderMensal(){
  const monthNames = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const daysInMonth = new Date(anoSel, mesSel, 0).getDate();
  const monthEntries = state.agenda.filter(e=>{
    const [y,m] = e.data.split('-').map(Number);
    return y===anoSel && m===mesSel;
  });
  const alunos = [...new Set(monthEntries.map(e=>e.nome))].sort((a,b)=>a.localeCompare(b));

  let headCells = '';
  for(let d=1; d<=daysInMonth; d++){ headCells += `<th>${String(d).padStart(2,'0')}</th>`; }

  let bodyRows = '';
  if(alunos.length===0){
    bodyRows = `<tr><td colspan="${daysInMonth+1}" class="empty">Nenhum lançamento em ${monthNames[mesSel-1]}/${anoSel} ainda.</td></tr>`;
  } else {
    alunos.forEach(nome=>{
      let cells = '';
      for(let d=1; d<=daysInMonth; d++){
        const iso = `${anoSel}-${String(mesSel).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const ent = monthEntries.filter(e=>e.nome===nome && e.data===iso);
        const display = [...new Set(ent.map(e=> displayLabelForEntry(e)))].join('/');
        const treinosUnicos = [...new Set(ent.map(e=>e.treino))];
        let cls = '';
        if(ent.length){
          if(ent.some(e=>e.confirmado===true)) cls = 'cellPresente';
          else if(ent.some(e=>e.confirmado===false)) cls = 'cellFalta';
          else if(treinosUnicos.length===1){
            const t = treinosUnicos[0];
            cls = t==='A'?'letterA':t==='B'?'letterB':t==='C'?'letterC':'';
          }
        }
        cells += `<td class="${cls}">${display}</td>`;
      }
      bodyRows += `<tr><td class="name">${escapeHtml(nome)}</td>${cells}</tr>`;
    });
  }

  const monthOptions = monthNames.map((m,i)=>`<option value="${i+1}" ${mesSel===i+1?'selected':''}>${m}</option>`).join('');

  return `
    <h1>Controle mensal</h1>
    <p class="subtitle">Puxado automaticamente da Agenda diária — não precisa preencher à mão.</p>
    <div class="card no-print">
      <div class="row">
        <div><label>Mês</label><select onchange="mesSel=parseInt(this.value,10);renderMain();">${monthOptions}</select></div>
        <div><label>Ano</label><input type="number" value="${anoSel}" style="width:90px;" onchange="anoSel=parseInt(this.value,10);renderMain();"></div>
        <div><button class="primary" onclick="window.print()">${icon('printer')} exportar PDF</button></div>
      </div>
    </div>
    <div class="print-header">
      <img src="${LOGO_SRC}" alt="Bio Corpus" />
      <div>
        <div class="print-brand">Bio Corpus Academia</div>
        <div class="print-title">Controle Mensal — ${monthNames[mesSel-1]} de ${anoSel}</div>
      </div>
    </div>
    <div class="card monthgrid-wrap">
      <table class="monthgrid">
        <thead><tr><th class="name">Aluno</th>${headCells}</tr></thead>
        <tbody>${bodyRows}</tbody>
      </table>
    </div>

function updateFicha(treino, bloco, field, value){
  const f = state.fichas.find(x=>x.treino===treino && x.bloco===bloco);

}

function addFichaBloco(treino){
  const existing = state.fichas.filter(f=>f.treino===treino);
  const nextBloco = existing.length ? Math.max(...existing.map(f=>f.bloco))+1 : 1;
  state.fichas.push({treino, bloco:nextBloco, exercicio1:'', exercicio2:'', exercicio3:''});
  saveState(); renderMain();
}

function removeFichaBloco(treino, bloco){
  state.fichas = state.fichas.filter(f=>!(f.treino===treino && f.bloco===bloco));
  saveState(); renderMain();
}

// ---------- PERSONALS ----------
function monthEntriesFor(mes, ano){
  return state.agenda.filter(e=>{
    const [y,m] = e.data.split('-').map(Number);
    return y===ano && m===mes;
  });
}

function relatorioAlunos(mes, ano){
  const entries = monthEntriesFor(mes, ano);
  const nomes = [...new Set(entries.map(e=>e.nome))].sort((a,b)=>a.localeCompare(b));
  return nomes.map(nome=>{
    const ent = entries.filter(e=>e.nome===nome);
    const confirmados = ent.filter(e=>e.confirmado===true).length;
    const faltas = ent.filter(e=>e.confirmado===false).length;
    const agendados = ent.length;
    const aluno = alunoByNome(nome);
    const freqPct = (confirmados+faltas)>0 ? Math.round(confirmados/(confirmados+faltas)*100) : null;
    return {nome, plano: aluno?planoLabel(aluno):'Sem cadastro', agendados, confirmados, faltas, freqPct};
  });
}

function relatorioPersonals(mes, ano){
  const entries = monthEntriesFor(mes, ano);
  return state.personals.map(p=>{
    const ent = entries.filter(e=>e.personal===p.code);
    const sessions = ent.length;
    const alunosAtendidos = new Set(ent.map(e=>e.nome)).size;
    const byDH = {};
    ent.forEach(e=>{ const k=e.data+'|'+e.hora; byDH[k]=(byDH[k]||0)+1; });
    let conflitos = 0;
    Object.values(byDH).forEach(c=>{ if(c>p.cap) conflitos++; });
    return {nome:p.nome, sessions, alunosAtendidos, conflitos};
  });
}

const DIA_ALIASES = {
  'dom':0,'domingo':0,
  'seg':1,'segunda':1,'segunda-feira':1,
  'ter':2,'terca':2,'terça':2,'terca-feira':2,'terça-feira':2,
  'qua':3,'quarta':3,'quarta-feira':3,
  'qui':4,'quinta':4,'quinta-feira':4,
  'sex':5,'sexta':5,'sexta-feira':5,
  'sab':6,'sáb':6,'sabado':6,'sábado':6
};

function parseHorariosToken(token){
  const t = token.trim();
  if(!t) return null;
  const m = t.match(/^([a-zA-ZçÇãÃéÉáÁ]+)\s*-?\s*(\d{1,2})h?$/i);
  if(!m) return null;
  const diaKey = m[1].toLowerCase().replace(/-feira$/,'').trim();
  const dia = DIA_ALIASES[diaKey];
  const hora = parseInt(m[2],10);
  if(dia===undefined || isNaN(hora)) return null;
  return {dia, hora};
}

function parsePlanoToken(token){
  const t = token.trim().toLowerCase();
  if(t==='2x' || t==='2') return {planoTipo:'2x', diasContratados:PLANOS['2x'].dias};
  if(t==='3x' || t==='3') return {planoTipo:'3x', diasContratados:PLANOS['3x'].dias};
  if(t==='4x' || t==='4') return {planoTipo:'4x', diasContratados:PLANOS['4x'].dias};
  const n = parseInt(t.replace('x',''),10);
  if(!isNaN(n) && n>0) return {planoTipo:'custom', diasContratados:n};
  return null;
}

function importAlunos(){
  const raw = document.getElementById('import_text').value;
  const resultEl = document.getElementById('import_result');
  const lines = raw.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
  let added=0, updated=0;
  const errors = [];

  lines.forEach((line, idx)=>{
    if(/^nome\b/i.test(line)) return; // skip header row if present

    let parts = line.includes('\t') ? line.split('\t') : line.split(';');
    parts = parts.map(p=>p.trim());
    const [nome, planoRaw, horariosRaw] = parts;

    if(!nome){ errors.push(`Linha ${idx+1}: nome vazio.`); return; }
    const plano = parsePlanoToken(planoRaw||'');
    if(!plano){ errors.push(`Linha ${idx+1} (${nome}): plano "${planoRaw||''}" não reconhecido.`); return; }

    const horariosFixos = [];
    if(horariosRaw){
      horariosRaw.split(',').forEach(tok=>{
        const h = parseHorariosToken(tok);
        if(h) horariosFixos.push(h);
        else if(tok.trim()) errors.push(`Linha ${idx+1} (${nome}): horário "${tok.trim()}" não reconhecido.`);
      });
    }

    const existing = alunoByNome(nome);
    if(existing){
      existing.planoTipo = plano.planoTipo;
      existing.diasContratados = plano.diasContratados;
      existing.horariosFixos = horariosFixos;
      updated++;
    } else {
      state.alunos.push({id:uid(), nome, planoTipo:plano.planoTipo, diasContratados:plano.diasContratados, horariosFixos});
      added++;
    }
  });

  saveState();
  document.getElementById('import_text').value = '';
  renderMain();

  setTimeout(()=>{
    const el = document.getElementById('import_result');
    if(!el) return;
    let html = `<span class="badge ok">${added} adicionado(s)</span> <span class="badge ok">${updated} atualizado(s)</span>`;
    if(errors.length){
      html += `<div style="margin-top:8px;color:var(--warn-ink);">${errors.map(e=>escapeHtml(e)).join('<br>')}</div>`;
    }
    el.innerHTML = html;
  }, 0);
}

function syncAgendaFuturaParaAluno(aluno){
  const hoje = todayISO();
  const horarios = aluno.horariosFixos || [];
  let removidos = 0;
  state.agenda = state.agenda.filter(e=>{
    const mesmoAluno = e.nome.trim().toLowerCase()===aluno.nome.trim().toLowerCase();
    if(!mesmoAluno || !e.origemAuto || e.confirmado===true) return true; // mantém: outro aluno, lançamento manual, ou presença já confirmada
    if(e.data < hoje) return true; // não mexe no passado
    const diaEntry = diaSemanaFromData(e.data);
    const aindaValido = horarios.some(h=>h.dia===diaEntry && h.hora===e.hora);
    if(!aindaValido){ removidos++; return false; }
    return true;
  });
  return removidos;
}

function addHorarioFixo(alunoId){
  const dia = parseInt(document.getElementById(`hf_dia_${alunoId}`).value,10);
  const hora = parseInt(document.getElementById(`hf_hora_${alunoId}`).value,10);
  const a = state.alunos.find(x=>x.id===alunoId);
  if(!a) return;
  a.horariosFixos = a.horariosFixos || [];
  if(!a.horariosFixos.some(h=>h.dia===dia && h.hora===hora)){
    a.horariosFixos.push({dia, hora});
  }
  const removidos = syncAgendaFuturaParaAluno(a);
  saveState();
  alunosNotice = removidos>0 ? `${removidos} lançamento(s) futuro(s) desatualizado(s) removido(s) da Agenda automaticamente.` : '';
  renderMain();
}

function removeHorarioFixo(alunoId, idx){
  const a = state.alunos.find(x=>x.id===alunoId);

  a.horariosFixos.splice(idx,1);

      <div class="row">
        <div><label>Código</label><input id="np_code" class="tag-input" maxlength="2" placeholder="Ex: F"></div>
        <div><label>Nome</label><input id="np_nome" placeholder="Nome"></div>
        <div><label>Cap. máx.</label><input id="np_cap" type="number" class="tag-input" value="3" min="1"></div>
        <div><button class="primary" onclick="addPersonal()">${icon('plus')} adicionar Personal</button></div>
      </div>
    </div>
  `;
}

function updatePersonal(idx, field, value){ state.personals[idx][field]=value; saveState(); }
function removePersonal(idx){ state.personals.splice(idx,1); saveState(); renderMain(); }
function addPersonal(){
  const code = document.getElementById('np_code').value.trim().toUpperCase();
  const nome = document.getElementById('np_nome').value.trim();
  const cap = parseInt(document.getElementById('np_cap').value,10)||3;
  if(!code || !nome) return;
  state.personals.push({code, nome, cap});
  saveState(); renderMain();
}

// ---------- ESTAÇÕES ----------
function renderEstacoes(){
  const rows = state.estacoes.map((e,idx)=>`
    <tr>
      <td><input value="${escapeHtml(e.nome)}" onchange="updateEstacao(${idx},'nome',this.value)" style="width:100%;"></td>
      <td><input type="number" class="tag-input" value="${e.cap}" min="1" onchange="updateEstacao(${idx},'cap',parseInt(this.value,10)||1)"></td>
      <td style="text-align:right;"><button class="icon" onclick="removeEstacao(${idx})">${icon('trash')}</button></td>
    </tr>
  `).join('');

  return `
    <h1>Estações</h1>
    <p class="subtitle">Quantidade física de cada aparelho — define o limite de conflito de equipamento.</p>
    <div class="card">
      <table>
        <thead><tr><th>Estação / aparelho</th><th style="width:140px;">Capacidade</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="card">
      <div class="row">
        <div style="flex:1;"><label>Nova estação</label><input id="ne_nome" placeholder="Nome do aparelho" style="width:100%;"></div>
        <div><label>Capacidade</label><input id="ne_cap" type="number" class="tag-input" value="1" min="1"></div>
        <div><button class="primary" onclick="addEstacao()">${icon('plus')} adicionar</button></div>
      </div>
    </div>
  `;
}

function renderLimites(){
  const diasOrdem = [1,2,3,4,5,6,0]; // Seg...Sáb, Dom por último
  let headCells = diasOrdem.map(d=>`<th>${DIAS_SEMANA[d]}</th>`).join('');
  let bodyRows = '';
  HOURS.forEach(h=>{
    let cells = diasOrdem.map(d=>{
      const key = `${d}-${h}`;
      const v = state.limitesHorario[key];
      const display = (v===undefined) ? '' : v;
      const cls = v===0 ? 'limite-fechado' : (v===undefined ? 'limite-pendente' : '');
      return `<td class="${cls}"><input type="number" min="0" value="${display}" placeholder="${v===undefined?'—':''}"
        style="width:52px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:4px;"
        onchange="updateLimite(${d},${h},this.value)"></td>`;
    }).join('');
    bodyRows += `<tr><td style="text-align:center;font-weight:600;">${h}h</td>${cells}</tr>`;
  });

  return `
    <h1>Limites de horário</h1>
    <p class="subtitle">Capacidade total de alunos por horário, variando por dia da semana — independente do Personal ou aparelho escolhido. Deixe em branco para "sem limite definido" (célula cinza), ou 0 para "fechado".</p>
    <div class="card">
      <div class="row" style="margin-bottom:10px;gap:16px;">
        <span class="small"><span class="chip" style="background:#991B1B;">0</span> = fechado</span>
        <span class="small"><span class="chip" style="background:#8A8F99;">—</span> = sem limite definido (ex.: sábado, pendente)</span>
      </div>
      <div class="monthgrid-wrap">
        <table class="monthgrid" style="font-size:12.5px;">
          <thead><tr><th>Hora</th>${headCells}</tr></thead>
          <tbody>${bodyRows}</tbody>
        </table>
      </div>
    </div>
  `;
}

function updateLimite(dia, hora, value){
  const key = `${dia}-${hora}`;
  const v = value.trim();
  if(v===''){
    delete state.limitesHorario[key];
  } else {
    const n = parseInt(v,10);
    state.limitesHorario[key] = isNaN(n) ? 0 : n;
  }
  saveState();
  renderMain();
}

function updateEstacao(idx, field, value){ state.estacoes[idx][field]=value; saveState(); }
function removeEstacao(idx){ state.estacoes.splice(idx,1); saveState(); renderMain(); }
function addEstacao(){
  const nome = document.getElementById('ne_nome').value.trim();
  const cap = parseInt(document.getElementById('ne_cap').value,10)||1;
  if(!nome) return;
  state.estacoes.push({nome, cap});
  saveState(); renderMain();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
